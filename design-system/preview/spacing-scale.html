<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px 28px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
  .token { font-family: 'JetBrains Mono'; font-size: 11px; color: #1F1F1F; width: 64px; }
  .px { font-family: 'JetBrains Mono'; font-size: 11px; color: #6B6B6B; width: 48px; }
  .bar { height: 14px; background: #1F1F1F; border-radius: 2px; }
  .label { font-family: 'Inter'; font-size: 11px; color: #6B6B6B; }
</style></head>
<body>
  <div class="row"><span class="token">--s-1</span><span class="px">4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="token">--s-2</span><span class="px">8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="token">--s-3</span><span class="px">12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="token">--s-4</span><span class="px">16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="token">--s-5</span><span class="px">24</span><span class="bar" style="width:24px"></span><span class="label">card padding</span></div>
  <div class="row"><span class="token">--s-6</span><span class="px">32</span><span class="bar" style="width:32px"></span><span class="label">hero card padding</span></div>
  <div class="row"><span class="token">--s-7</span><span class="px">48</span><span class="bar" style="width:48px"></span><span class="label">section · mobile</span></div>
  <div class="row"><span class="token">--s-8</span><span class="px">64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="token">--s-9</span><span class="px">96</span><span class="bar" style="width:96px"></span><span class="label">section · desktop</span></div>
  <div class="row"><span class="token">--s-10</span><span class="px">128</span><span class="bar" style="width:128px"></span></div>
</body></html>
