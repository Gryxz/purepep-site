<!doctype html>
<html><head><meta charset="utf-8"><title>Radii & shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px; }
  .row { display: flex; gap: 24px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 96px; height: 64px; background: #F2D7D7; border: 1px solid rgba(107,107,107,0.15); }
  .lbl { font-family: 'JetBrains Mono'; font-size: 10px; color: #6B6B6B; }
  .name { font-family: 'Inter'; font-size: 11px; color: #1F1F1F; font-weight: 500; }
  hr { border: 0; border-top: 1px solid rgba(107,107,107,0.15); margin: 22px 0; }
  .sh-row { display: flex; gap: 32px; }
  .sh { width: 140px; height: 80px; background: #F5EBD8; border-radius: 8px; }
  .sh.soft { box-shadow: 0 1px 2px rgb(31 31 31 / 0.04), 0 4px 12px rgb(31 31 31 / 0.04); }
  .sh.lift { box-shadow: 0 2px 4px rgb(31 31 31 / 0.06), 0 16px 40px rgb(31 31 31 / 0.08); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:2px"></div><div class="name">2px</div><div class="lbl">--r-xs · tags</div></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">4px</div><div class="lbl">--r-sm · button</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">8px</div><div class="lbl">--r-md · cards</div></div>
    <div class="item"><div class="box" style="border-radius:9999px;width:64px;height:24px"></div><div class="name">9999px</div><div class="lbl">--r-pill · status</div></div>
  </div>
  <hr/>
  <div class="sh-row">
    <div class="item"><div class="sh soft"></div><div class="name">--shadow-soft</div><div class="lbl">cards · modals</div></div>
    <div class="item"><div class="sh lift"></div><div class="name">--shadow-lift</div><div class="lbl">drawer · hover</div></div>
  </div>
</body></html>
