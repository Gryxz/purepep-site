<!doctype html>
<html><head><meta charset="utf-8"><title>Logo lockups</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; min-height: 240px; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
  .cream { background: #F5EBD8; border-right: 1px solid rgba(107,107,107,0.15); }
  .blush { background: #F2D7D7; border-right: 1px solid rgba(107,107,107,0.15); }
  .dark { background: #1F1F1F; }
  .cap { font-family: 'Inter'; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B6B; }
  .dark .cap { color: rgba(245,235,216,0.6); }
  img { display: block; }
</style></head>
<body>
  <div class="cell cream">
    <img src="../assets/purepep-wordmark.svg" width="220" alt="PurePep">
    <div class="cap">Wordmark · Eggshell</div>
  </div>
  <div class="cell blush">
    <img src="../assets/purepep-wordmark.svg" width="220" alt="PurePep">
    <div class="cap">Wordmark · Soft Blush</div>
  </div>
  <div class="cell dark">
    <img src="../assets/purepep-mark.svg" width="72" alt="PurePep mark">
    <div class="cap">Mark · Carbon</div>
  </div>
</body></html>
