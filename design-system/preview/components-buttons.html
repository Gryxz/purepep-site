<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: 110px repeat(3, 1fr); gap: 16px; align-items: center; }
  .label { font-family: 'Inter'; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B6B; }
  .col-h { font-family: 'Inter'; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B6B; text-align: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 4px; font-family: 'Inter'; font-size: 13px; font-weight: 500; border: 1px solid transparent; cursor: pointer; transition: all 180ms cubic-bezier(0.2,0.6,0.2,1); }
  .primary { background: #1F1F1F; color: #F5EBD8; }
  .primary.hover { background: #000; }
  .copper { background: #C75D3A; color: #F5EBD8; }
  .copper.hover { background: #B34F2E; }
  .ghost { background: transparent; color: #1F1F1F; border-color: #1F1F1F; }
  .ghost.hover { background: rgba(31,31,31,0.04); }
  .cell { display: flex; justify-content: center; }
</style></head>
<body>
  <div class="grid">
    <div></div>
    <div class="col-h">Default</div><div class="col-h">Hover</div><div class="col-h">Disabled</div>
    <div class="label">Primary</div>
    <div class="cell"><button class="btn primary">Add to cart</button></div>
    <div class="cell"><button class="btn primary hover">Add to cart</button></div>
    <div class="cell"><button class="btn primary" style="opacity:0.4;cursor:not-allowed">Add to cart</button></div>
    <div class="label">Copper</div>
    <div class="cell"><button class="btn copper">Reserve a vial</button></div>
    <div class="cell"><button class="btn copper hover">Reserve a vial</button></div>
    <div class="cell"><button class="btn copper" style="opacity:0.4;cursor:not-allowed">Reserve a vial</button></div>
    <div class="label">Outline</div>
    <div class="cell"><button class="btn ghost">View COA</button></div>
    <div class="cell"><button class="btn ghost hover">View COA</button></div>
    <div class="cell"><button class="btn ghost" style="opacity:0.4;cursor:not-allowed">View COA</button></div>
  </div>
</body></html>
