<!doctype html>
<html><head><meta charset="utf-8"><title>Palette — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: #FAF6EC; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { display: flex; flex-direction: column; }
  .chip { height: 96px; border-radius: 4px; border: 1px solid var(--hairline); }
  .name { font-family: var(--font-serif); font-size: 15px; margin-top: 10px; color: var(--fg); }
  .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
  .role { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-muted); margin-top: 6px; }
</style></head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#F5EBD8"></div><div class="name">Eggshell</div><div class="hex">#F5EBD8</div><div class="role">Canvas</div></div>
    <div class="swatch"><div class="chip" style="background:#F2D7D7"></div><div class="name">Soft Blush</div><div class="hex">#F2D7D7</div><div class="role">Surface</div></div>
    <div class="swatch"><div class="chip" style="background:#1F1F1F"></div><div class="name">Carbon Black</div><div class="hex">#1F1F1F</div><div class="role">Text · primary</div></div>
    <div class="swatch"><div class="chip" style="background:#6B6B6B"></div><div class="name">Dim Grey</div><div class="hex">#6B6B6B</div><div class="role">Body · muted</div></div>
    <div class="swatch"><div class="chip" style="background:#C75D3A"></div><div class="name">Rosy Copper</div><div class="hex">#C75D3A</div><div class="role">Accent · CTA</div></div>
  </div>
</body></html>
