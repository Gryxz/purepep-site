<!doctype html>
<html><head><meta charset="utf-8"><title>Form fields</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-family: 'Inter'; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B6B; }
  .input { height: 44px; padding: 0 14px; background: #F5EBD8; border: 1px solid rgba(107,107,107,0.15); border-radius: 4px; font-family: 'Inter'; font-size: 14px; color: #1F1F1F; outline: none; }
  .input.focus { border-color: #1F1F1F; box-shadow: 0 0 0 2px rgba(199,93,58,0.4); }
  .help { font-family: 'Inter'; font-size: 12px; color: #6B6B6B; }
  .err  { font-family: 'Inter'; font-size: 12px; color: #C75D3A; }
  .check-row { display: flex; align-items: center; gap: 10px; font-family: 'Inter'; font-size: 13px; color: #1F1F1F; }
  .check { width: 18px; height: 18px; border: 1px solid #1F1F1F; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; }
  .check.on { background: #1F1F1F; }
  .check.on::after { content: ''; width: 8px; height: 4px; border-left: 1.5px solid #F5EBD8; border-bottom: 1.5px solid #F5EBD8; transform: rotate(-45deg) translate(1px,-1px); }
</style></head>
<body>
  <div class="field">
    <div class="lbl">Email address</div>
    <input class="input" value="researcher@lab.edu">
    <div class="help">We use this for order confirmations and COA delivery.</div>
  </div>
  <div class="field">
    <div class="lbl">Date of birth</div>
    <input class="input focus" value="1991-04-12">
    <div class="help">21+ qualified researchers only.</div>
  </div>
  <div class="field">
    <div class="lbl">Institution</div>
    <input class="input" placeholder="University, lab, or company">
    <div class="err">Institution is required for verification.</div>
  </div>
  <div class="field">
    <div class="lbl">Acknowledgements</div>
    <div class="check-row"><span class="check on"></span> I confirm research use only.</div>
    <div class="check-row"><span class="check"></span> I accept the no-refund policy.</div>
  </div>
</body></html>
