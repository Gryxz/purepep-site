<!doctype html>
<html><head><meta charset="utf-8"><title>Compliance block</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px; }
  .block { display: grid; grid-template-columns: 24px 1fr; gap: 14px; padding: 20px 24px; border: 1px solid rgba(107,107,107,0.15); border-radius: 8px; background: #F5EBD8; max-width: 640px; }
  .ic { width: 24px; height: 24px; color: #C75D3A; }
  h4 { font-family: 'Fraunces'; font-weight: 500; font-size: 16px; margin: 0 0 4px; color: #1F1F1F; letter-spacing: -0.01em; }
  p { font-family: 'Inter'; font-size: 13px; line-height: 1.55; color: #6B6B6B; margin: 0; }
  .stk > * + * { margin-top: 12px; }
</style></head>
<body>
  <div class="stk">
    <div class="block">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <div>
        <h4>For research use only — not for human consumption.</h4>
        <p>Sales restricted to qualified researchers, 21 and over. PurePep does not provide medical, dosage, or therapeutic guidance.</p>
      </div>
    </div>
    <div class="block">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <div>
        <h4>All sales final.</h4>
        <p>No refunds, no exchanges, no returns. Review the certificate of analysis before purchase.</p>
      </div>
    </div>
  </div>
</body></html>
