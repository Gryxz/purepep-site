<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px 32px; }
  .stack > * + * { margin-top: 12px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .label { width: 110px; font-family: 'Inter'; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B6B; }
  .specimen { font-family: 'Fraunces'; font-weight: 500; color: #1F1F1F; letter-spacing: -0.02em; line-height: 1.05; }
  .meta { font-family: 'JetBrains Mono'; font-size: 10px; color: #6B6B6B; margin-left: auto; }
</style></head>
<body>
  <div class="stack">
    <div class="row"><div class="label">Display XL</div><div class="specimen" style="font-size:48px">Research, framed.</div><div class="meta">Fraunces · 64 / 1.05</div></div>
    <div class="row"><div class="label">Display L</div><div class="specimen" style="font-size:36px">Lyophilized retatrutide</div><div class="meta">Fraunces · 48 / 1.10</div></div>
    <div class="row"><div class="label">H1</div><div class="specimen" style="font-size:28px">RETA · 10 mg vial</div><div class="meta">Fraunces · 36 / 1.15</div></div>
    <div class="row"><div class="label">H2</div><div class="specimen" style="font-size:22px">Certificate of analysis</div><div class="meta">Fraunces · 28 / 1.20</div></div>
  </div>
</body></html>
